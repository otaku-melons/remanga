[build-system]
requires = ["uv-build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "remanga"
version = "2.8.0"
description = "Melon parser module for ReManga."
readme = "README.md"
authors = [
	{ name = "dub1401", email = "vlad.milosta@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
	"melon>=1.0.0rc8",
]

[project.entry-points."melon.parsers"]
remanga = "remanga"

[dependency-groups]
dev = ["ruff", "ty", "typos"]
